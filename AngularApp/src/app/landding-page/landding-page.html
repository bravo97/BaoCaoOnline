<div
  class="min-h-screen bg-gradient-to-br from-white via-blue-50 to-indigo-50 selection:bg-[#2563eb] selection:text-white font-sans text-slate-900 relative overflow-hidden flex flex-col">

  <!-- 1. Dynamic Chart Background Layer (Moving Lines) - Increased Opacity -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-30">
    <!-- Chart Line 1 -->
    <svg class="absolute bottom-0 left-0 w-full h-[50vh] animate-chart-slide-1" viewBox="0 0 1440 320"
      preserveAspectRatio="none">
      <path fill="url(#grad1)" fill-opacity="0.4"
        d="M0,192L48,197.3C96,203,192,213,288,229.3C384,245,480,267,576,250.7C672,235,768,181,864,181.3C960,181,1056,235,1152,234.7C1248,235,1344,181,1392,154.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z">
      </path>
      <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
        </linearGradient>
      </defs>
    </svg>

    <!-- Chart Line 2 (Delayed/Offset) -->
    <svg class="absolute bottom-0 left-0 w-full h-[60vh] animate-chart-slide-2" viewBox="0 0 1440 320"
      preserveAspectRatio="none">
      <path fill="url(#grad2)" fill-opacity="0.2"
        d="M0,64L48,80C96,96,192,128,288,128C384,128,480,96,576,106.7C672,117,768,171,864,197.3C960,224,1056,224,1152,197.3C1248,171,1344,117,1392,90.7L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z">
      </path>
      <defs>
        <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- 2. Animated Particles (New Layer) -->
  <div class="fixed inset-0 pointer-events-none z-0">
    <div class="absolute top-[10%] left-[20%] w-2 h-2 bg-blue-400 rounded-full animate-ping-slow"></div>
    <div class="absolute top-[40%] right-[20%] w-3 h-3 bg-cyan-400 rounded-full animate-ping-slow delay-700"></div>
    <div class="absolute bottom-[30%] left-[40%] w-2 h-2 bg-indigo-400 rounded-full animate-ping-slow delay-500"></div>
  </div>

  <!-- 3. Floating Pattern Elements (Shapes) - Faster & More Visible -->
  <div class="fixed inset-0 pointer-events-none z-0">
    <div
      class="absolute top-[15%] left-[10%] w-20 h-20 bg-[#2563eb]/10 rounded-2xl rotate-12 animate-float backdrop-blur-sm border border-[#2563eb]/20 shadow-xl">
    </div>
    <div
      class="absolute top-[25%] right-[15%] w-32 h-32 bg-cyan-500/10 rounded-full animate-float-fast backdrop-blur-sm border border-cyan-500/20 shadow-xl">
    </div>
    <div
      class="absolute bottom-[30%] left-[15%] w-16 h-16 bg-indigo-400/20 rounded-lg rotate-45 animate-float-reverse-fast backdrop-blur-sm shadow-lg">
    </div>
    <div
      class="absolute bottom-[20%] right-[30%] w-40 h-40 border-4 border-slate-300/40 rounded-full animate-pulse-fast opacity-40">
    </div>

    <!-- Rising Graph Icons -->
    <i
      class="fa-solid fa-arrow-trend-up absolute top-[35%] left-[5%] text-5xl text-[#2563eb]/20 animate-bounce-slow"></i>
    <i
      class="fa-solid fa-chart-pie absolute bottom-[15%] left-[50%] text-9xl text-slate-100/50 -z-10 animate-spin-slow"></i>
    <i
      class="fa-solid fa-chart-simple absolute bottom-[40%] right-[5%] text-7xl text-cyan-500/15 animate-pulse-fast"></i>
  </div>

  <!-- Header -->
  <header class="w-full px-6 py-5 absolute top-0 z-50 bg-white/70 backdrop-blur-lg border-b border-white/60 shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer group">
        <div
          class="w-10 h-10 bg-[#2563eb] rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30 group-hover:scale-110 transition-transform">
          <i class="fa-solid fa-chart-pie text-lg"></i>
        </div>
        <div class="flex flex-col leading-none">
          <span class="text-2xl font-black text-slate-800 tracking-tight">Report<span
              class="text-[#2563eb]">Online</span></span>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center relative z-10 px-6 pt-20">
    <!-- Hero Section -->
    <div class="text-center max-w-5xl mx-auto py-12">

      <!-- Badge -->
      <div
        class="inline-flex items-center gap-3 px-5 py-2 rounded-full bg-white border border-[#2563eb]/30 shadow-md text-[#2563eb] text-xs font-bold uppercase tracking-widest mb-10 animate-in slide-in-from-bottom-4 duration-700 hover:scale-105 transition-transform cursor-default select-none">
        <span class="flex h-2 w-2 rounded-full bg-[#2563eb] animate-pulse"></span>
        Giải pháp quản trị thông minh
      </div>

      <!-- Hero Title -->
      <h1
        class="text-6xl md:text-8xl font-black tracking-tighter text-slate-900 mb-8 leading-tight animate-in zoom-in-50 duration-1000 drop-shadow-sm">
        Dữ Liệu Trong Tầm Tay.<br />
        <span class="text-[#2563eb] relative inline-block">
          Tăng Trưởng Bền Vững.
          <!-- Underline decoration -->
          <svg class="absolute w-full h-3 -bottom-2 left-0 text-[#2563eb] opacity-50" viewBox="0 0 200 9" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path d="M2.00025 6.99997C25.7501 9.75001 59.6588 1.50001 200.25 1.50001" stroke="currentColor"
              stroke-width="3"></path>
          </svg>
        </span>
      </h1>

      <p
        class="text-lg md:text-2xl text-slate-600 max-w-3xl mx-auto mb-16 font-semibold leading-relaxed animate-in fade-in slide-in-from-bottom-8 duration-1000 delay-300">
        Nền tảng báo cáo tự động hóa, trực quan và bảo mật. <br class="hidden md:block"> Giúp doanh nghiệp ra quyết định
        nhanh chóng từ số liệu thực tế.
      </p>

      <div class="animate-in fade-in slide-in-from-bottom-10 duration-1000 delay-500 relative z-20">
        <div class="relative inline-block group">
          <!-- Button Glow Effect -->
          <div
            class="absolute -inset-1 bg-[#2563eb] rounded-xl blur opacity-30 group-hover:opacity-60 transition duration-500">
          </div>

          <button (click)="goToLogin()"
            class="relative bg-[#2563eb] hover:bg-[#1d4ed8] text-white px-12 py-6 rounded-xl font-bold text-xl shadow-xl transition-all active:scale-95 flex items-center justify-center gap-4 min-w-[320px] cursor-pointer border-t border-white/20">
            <span class="">Truy cập hệ thống</span>
            <i class="fa-solid fa-arrow-right-to-bracket animate-bounce-x"></i>
          </button>
        </div>

        <div class="mt-8 flex items-center justify-center gap-8 text-sm font-bold text-slate-500">
          <span class="flex items-center gap-2 px-4 py-2 bg-white/50 rounded-lg backdrop-blur-sm shadow-sm"><i
              class="fa-solid fa-bolt text-yellow-500"></i> Real-time</span>
          <span class="flex items-center gap-2 px-4 py-2 bg-white/50 rounded-lg backdrop-blur-sm shadow-sm"><i
              class="fa-solid fa-mobile-screen text-blue-500"></i> Mobile Ready</span>
          <span class="flex items-center gap-2 px-4 py-2 bg-white/50 rounded-lg backdrop-blur-sm shadow-sm"><i
              class="fa-solid fa-cloud text-[#2563eb]"></i> Cloud Based</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="w-full py-6 text-center text-slate-400 text-xs font-bold uppercase tracking-widest relative z-10">
    © 2025 ReportOnline Enterprise.
  </footer>
</div>
