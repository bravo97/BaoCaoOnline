<div class="login-page">
  <div class="login-container">
    <div class="login-card">
      <h2>Đăng nhập</h2>
      <p class="subtitle">Truy cập hệ thống xem báo cáo online</p>

      <form>
        <!-- Customer Key Verification Section -->
        <div *ngIf="!isKeyVerified" class="key-verification-section">
          <div class="form-group">
            <label for="customerKey">Customer Key</label>
            <input [(ngModel)]="customerKey" id="customerKey" name="customerKey" type="text"
              placeholder="Nhập customer key (GUID)" (keypress)="onKeyPress($event)" [disabled]="isVerifying" required
              autocomplete="off" />
          </div>

          <div *ngIf="keyError" class="error-message">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>{{ keyError }}</span>
          </div>

          <button class="verify-btn" type="button" (click)="verifyCustomerKey()" [disabled]="isVerifying"
            [class.loading]="isVerifying">
            <span *ngIf="!isVerifying">Xác Thực</span>
            <span *ngIf="isVerifying" class="loading-text">Đang xác thực...</span>
          </button>
        </div>

        <!-- Login Section (shown after key verification) -->
        <div *ngIf="isKeyVerified" class="login-section">
          <div class="success-message">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span>Key đã xác thực thành công</span>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input [(ngModel)]="loginModel.username" id="email" name="username" placeholder="Nhập email của bạn"
              required />
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input [(ngModel)]="loginModel.password" id="password" name="password" type="password"
              placeholder="Nhập mật khẩu" required />
          </div>

          <button class="login-btn" type="button" (click)="Login()">Đăng nhập</button>

          <div class="links">
            <a href="#">Quên mật khẩu?</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
