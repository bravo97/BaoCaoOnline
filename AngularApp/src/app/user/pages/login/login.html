<div class="login-page">
  <div class="login-container">
    <div class="login-card">
      <h2>Đăng nhập</h2>
      <p class="subtitle">Truy cập hệ thống xem báo cáo online</p>

      <form #loginForm="ngForm">
        <div class="form-group" >
          <label for="email">Email</label>
          <input [(ngModel)]="loginModel.username" id="email"  placeholder="Nhập email của bạn" required />
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input [(ngModel)]="loginModel.password" id="password" type="password" placeholder="Nhập mật khẩu" required />
        </div>

        <button class="login-btn" (click)="Login()">Đăng nhập</button>

        <div class="links">
          <a href="#">Quên mật khẩu?</a>
        </div>
      </form>
    </div>
  </div>
</div>
