<div class="report-page">
  <div class="report-header">
    <div class="filter-item">
      <label for="fromDate">Từ ngày</label>
      <input id="fromDate" type="date" [(ngModel)]="fromDate">
    </div>

    <div class="filter-item">
      <label for="toDate">Đến ngày</label>
      <input id="toDate" type="date" [(ngModel)]="toDate">
    </div>

    <button class="filter-btn" (click)="applyFilter()">Lọc dữ liệu</button>
  </div>

  <!-- table container: scroll phải/dọc, flex:1 để chiếm vùng còn lại -->
  <div class="table-container" *ngIf="report">
    <table class="report-table">
      <thead>
        <tr>
          <th *ngFor="let col of columns">{{ col.displayName }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of pagedData">
          <td *ngFor="let col of columns">{{ row[col.columnName] }}</td>
        </tr>
      </tbody>
    </table>

    <ng-template #emptyTpl>
      <div class="empty-state">Không có dữ liệu</div>
    </ng-template>
  </div>

  <!-- pagination -->
  <div class="pagination" *ngIf="totalPages > 0">
    <button (click)="prevPage()" [disabled]="pageIndex === 0">«</button>
    <span>Trang {{ pageIndex + 1 }} / {{ totalPages }}</span>
    <button (click)="nextPage()" [disabled]="pageIndex >= totalPages - 1">»</button>
  </div>
</div>
