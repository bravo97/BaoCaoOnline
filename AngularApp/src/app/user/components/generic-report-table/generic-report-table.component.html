<div class="h-full flex flex-col gap-2 animate-in fade-in duration-500">
    <!-- Mobile Filter Toggle Button -->
    <div class="md:hidden flex justify-between items-center px-1 mb-2">
        <h3 class="font-bold text-slate-700 dark:text-slate-200">Bộ lọc báo cáo</h3>
        <button (click)="toggleMobileFilter()"
            class="bg-accent text-white px-4 py-2 rounded-lg text-sm font-bold shadow-lg shadow-accent/20 flex items-center gap-2">
            <i class="fa-solid fa-filter"></i>
            <span>Lọc dữ liệu</span>
        </button>
    </div>

    <!-- Filter Container (Responsive) -->
    <div [class.fixed]="showMobileFilter" [class.inset-0]="showMobileFilter" [class.z-[9999]]="showMobileFilter"
        [class.bg-white]="showMobileFilter" [class.dark:bg-slate-900]="showMobileFilter" [class.p-0]="showMobileFilter"
        [class.flex]="showMobileFilter" [class.flex-col]="showMobileFilter"
        class="glass-effect rounded-xl p-4 shadow-md border border-slate-200 dark:border-glass/40 bg-white/80 dark:bg-slate-800/50 backdrop-blur-md md:block"
        [class.hidden]="!showMobileFilter">

        <!-- Mobile Modal Header -->
        <div class="md:hidden flex items-center justify-between px-4 py-3 border-b border-slate-100 dark:border-white/10 shrink-0"
            *ngIf="showMobileFilter">
            <h3 class="text-lg font-bold text-slate-800 dark:text-white">Bộ lọc tìm kiếm</h3>
            <button (click)="toggleMobileFilter()"
                class="w-8 h-8 rounded-full bg-slate-100 dark:bg-white/10 flex items-center justify-center text-slate-500 hover:text-red-500 transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Scrollable Content Area -->
        <div [class.flex-1]="showMobileFilter" [class.overflow-y-auto]="showMobileFilter" [class.p-4]="showMobileFilter"
            class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 items-end md:overflow-visible">

            <div class="flex flex-col gap-1.5" *ngFor="let param of parameters">
                <div class="flex items-center gap-2">
                    <div
                        class="w-6 h-6 rounded-md bg-accent/10 flex items-center justify-center text-accent text-[10px]">
                        <i class="fa-solid" [class.fa-calendar-days]="param.type === 'date'"
                            [class.fa-font]="param.type === 'text'" [class.fa-hashtag]="param.type === 'number'"
                            [class.fa-check-square]="param.type === 'boolean'"></i>
                    </div>
                    <label [for]="param.key"
                        class="text-[11px] font-bold uppercase tracking-wide text-slate-700 dark:text-slate-300 truncate cursor-pointer hover:text-accent transition-colors">
                        {{ param.label }}
                    </label>
                </div>

                <!-- Date Input -->
                <input *ngIf="param.type === 'date'" [id]="param.key" type="date" [(ngModel)]="param.value"
                    class="input-glass w-full h-[44px] md:h-auto" />

                <!-- Text/Number Input -->
                <input *ngIf="param.type === 'text' || param.type === 'number'" [id]="param.key" [type]="param.type"
                    [(ngModel)]="param.value" [placeholder]="param.placeholder || ''"
                    class="input-glass w-full h-[44px] md:h-auto" />

                <!-- Select Input -->
                <select *ngIf="param.type === 'select'" [id]="param.key" [(ngModel)]="param.value"
                    class="input-glass w-full appearance-none h-[44px] md:h-auto">
                    <option [ngValue]="undefined">-- Tất cả --</option>
                    <option *ngFor="let opt of param.options"
                        [ngValue]="param.valueField ? opt[param.valueField] : (opt.Id || opt.Ma || opt.Code || opt.Key)">
                        {{ getDisplayValue(opt, param) }}
                    </option>
                </select>

                <!-- Boolean Input -->
                <div *ngIf="param.type === 'boolean'" class="h-[44px] md:h-[34px] flex items-center px-1">
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" [(ngModel)]="param.value" class="sr-only peer">
                        <div
                            class="w-9 h-5 bg-slate-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-accent/20 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-accent">
                        </div>
                        <span class="ml-2 text-[10px] font-medium text-slate-600 dark:text-slate-400">Kích hoạt</span>
                    </label>
                </div>
            </div>

            <!-- Spacer for mobile bottom bar -->
            <div class="h-20 md:hidden w-full"></div>

            <!-- Filter Button Area -->
            <div
                class="flex items-end h-auto shrink-0 md:w-auto w-full fixed bottom-0 left-0 right-0 p-4 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-white/5 md:static md:bg-transparent md:border-0 md:p-0 z-50">
                <button [disabled]="isLoading || !report"
                    class="w-full bg-gradient-to-r from-accent to-accent-hover hover:from-accent-hover hover:to-accent text-white font-bold py-2 px-4 rounded-lg shadow-lg shadow-accent/20 transition-all duration-300 hover:shadow-xl active:scale-95 flex items-center justify-center gap-2 text-xs disabled:opacity-50 disabled:cursor-not-allowed h-[44px] md:h-[34px]"
                    (click)="applyFilter(); showMobileFilter = false">
                    <i class="fa-solid" [class.fa-filter]="!isLoading" [class.fa-circle-notch]="isLoading"
                        [class.animate-spin]="isLoading"></i>
                    {{ isLoading ? 'Đang xử lý...' : 'Áp dụng bộ lọc' }}
                </button>
            </div>
        </div>
    </div>

    <!-- Main Table View with Smooth Transitions -->
    <div
        class="flex-1 min-height-0 glass-card p-0 overflow-hidden flex flex-col border-2 border-slate-400 dark:border-glass/60 shadow-lg bg-white dark:glass-effect relative">

        <!-- Subtle Loading Overlay - doesn't hide content -->
        <div *ngIf="isLoading"
            class="absolute inset-0 z-30 bg-white/60 dark:bg-slate-900/40 backdrop-blur-[1px] flex items-center justify-center pointer-events-none">
            <div
                class="flex flex-col items-center gap-2 bg-white/95 dark:bg-slate-800/90 px-4 py-3 rounded-lg shadow-xl border border-slate-200 dark:border-slate-700">
                <div class="w-8 h-8 border-3 border-accent/30 border-t-accent rounded-full animate-spin"></div>
                <p class="text-[9px] font-bold uppercase tracking-wider text-accent">Đang tải chập chờn...</p>
            </div>
        </div>

        <!-- Empty State when no report -->
        <div *ngIf="!report && !isLoading" class="flex-1 flex items-center justify-center">
            <div class="flex flex-col items-center gap-4 opacity-40">
                <i class="fa-solid fa-file-circle-question text-5xl text-slate-500"></i>
                <p class="text-slate-600 font-black uppercase tracking-widest text-[10px]">Chưa chọn báo cáo</p>
            </div>
        </div>

        <!-- Table container with horizontal scroll support -->
        <div class="flex-1 overflow-auto custom-scrollbar w-full max-w-[100vw]" *ngIf="report">
            <table class="min-w-full text-left border-separate border-spacing-0">
                <thead class="sticky top-0 z-20">
                    <tr class="bg-white dark:bg-secondary text-slate-900 dark:text-white">
                        <th *ngFor="let col of columns; let first = first; let last = last"
                            [class.rounded-tl-xl]="first" [class.rounded-tr-xl]="last"
                            [style.min-width.px]="col.columnWidth"
                            class="px-3 py-2.5 text-[11px] font-black uppercase tracking-wide border-b border-slate-200 dark:border-white/10 border-r border-slate-200 dark:border-white/5 last:border-r-0 shadow-sm whitespace-nowrap bg-white dark:bg-secondary">
                            {{ col.displayName }}
                        </th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-white/5">
                    <tr *ngFor="let row of pagedData" class="group hover:bg-accent/5 transition-colors duration-150">
                        <td *ngFor="let col of columns" [style.min-width.px]="col.columnWidth"
                            class="px-3 py-2 text-xs text-slate-900 dark:text-slate-200 font-medium leading-snug border-r border-slate-100 dark:border-white/5 last:border-r-0 whitespace-nowrap">
                            {{ row[col.columnName] }}
                        </td>
                    </tr>

                    <tr *ngIf="pagedData.length === 0 && !isLoading">
                        <td [attr.colspan]="columns.length" class="py-20 text-center">
                            <div class="flex flex-col items-center gap-4 opacity-40">
                                <i class="fa-solid fa-file-circle-exclamation text-5xl text-slate-500"></i>
                                <p class="text-slate-600 font-black uppercase tracking-widest text-[10px]">Không có dữ
                                    liệu báo cáo</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination Control -->
        <div class="px-4 py-3 bg-slate-100/80 dark:bg-secondary/50 backdrop-blur-md border-t border-slate-300 dark:border-glass/60 flex flex-col md:flex-row items-center justify-between gap-3"
            *ngIf="totalPages > 0">
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2">
                    <span
                        class="text-[10px] font-black uppercase tracking-widest text-slate-700 dark:text-secondary/60">Dòng:</span>
                    <select [(ngModel)]="pageSize" (change)="onPageSizeChange()"
                        class="bg-white dark:bg-primary/50 border border-slate-300 dark:border-glass rounded-lg px-2 py-1 text-[11px] font-bold text-slate-900 dark:text-primary focus:outline-none focus:ring-2 focus:ring-accent/50 cursor-pointer">
                        <option *ngFor="let size of pageSizeOptions" [value]="size">{{size}}</option>
                    </select>
                </div>
                <div class="h-3 w-px bg-slate-400 dark:bg-glass/40"></div>
                <div class="text-[10px] font-black text-slate-700 dark:text-secondary/60 uppercase tracking-[0.05em]">
                    Tổng: <span class="text-accent">{{ data.length }}</span>
                </div>
            </div>

            <div class="flex items-center gap-1.5 transition-opacity duration-300" [class.opacity-50]="isLoading">
                <button (click)="prevPage()" [disabled]="pageIndex === 0 || isLoading"
                    class="w-8 h-8 rounded-lg bg-white border border-slate-300 dark:border-glass flex items-center justify-center text-slate-700 dark:text-primary hover:bg-accent hover:text-white transition-all disabled:opacity-30 disabled:cursor-not-allowed shadow-sm">
                    <i class="fa-solid fa-chevron-left text-[10px]"></i>
                </button>

                <div class="flex items-center gap-1">
                    <button *ngFor="let p of getPageNumbers()" (click)="goToPage(p)" [disabled]="isLoading"
                        class="min-w-[32px] h-8 px-1.5 rounded-lg text-[11px] font-black transition-all"
                        [class.bg-accent]="p === pageIndex" [class.text-white]="p === pageIndex"
                        [class.shadow-md]="p === pageIndex" [class.text-slate-700]="p !== pageIndex"
                        [class.dark:text-secondary]="p !== pageIndex" [class.hover:bg-accent/10]="p !== pageIndex">
                        {{ p + 1 }}
                    </button>
                    <span *ngIf="totalPages > 5 && (pageIndex < totalPages - 3)"
                        class="px-1 text-slate-500 dark:text-secondary opacity-40 text-[10px]">...</span>
                    <button *ngIf="totalPages > 5 && (pageIndex < totalPages - 3)" (click)="goToPage(totalPages - 1)"
                        [disabled]="isLoading"
                        class="min-w-[32px] h-8 px-1.5 rounded-lg text-[11px] font-black text-slate-700 dark:text-secondary hover:bg-accent/10 transition-all">
                        {{ totalPages }}
                    </button>
                </div>

                <button (click)="nextPage()" [disabled]="pageIndex >= totalPages - 1 || isLoading"
                    class="w-8 h-8 rounded-lg bg-white border border-slate-300 dark:border-glass flex items-center justify-center text-slate-700 dark:text-primary hover:bg-accent hover:text-white transition-all disabled:opacity-30 disabled:cursor-not-allowed shadow-sm">
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>
            </div>
        </div>
    </div>
</div>
