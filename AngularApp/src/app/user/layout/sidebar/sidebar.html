<div class="fixed inset-0 bg-black/50 z-[999] backdrop-blur-sm transition-opacity"
  *ngIf="layoutService.mobileSidebarOpen()" (click)="layoutService.closeMobileSidebar()" style="max-width: 100vw;">
</div>

<nav class="sidebar glass-effect" [class.collapsed]="sidebarCollapsed"
  [class.mobile-open]="layoutService.mobileSidebarOpen()">
  <div class="sidebar-header">
    <div class="logo-container" *ngIf="!sidebarCollapsed">
      <div class="logo-icon">
        <i class="fa-solid fa-chart-pie"></i>
      </div>
      <div class="logo-text">
        <span class="brand">ReportOnline</span>
        <span class="sub">User Hub</span>
      </div>
    </div>
    <button (click)="toggleSidebar()" class="toggle-btn" [title]="sidebarCollapsed ? 'Mở rộng' : 'Thu gọn'">
      <i class="fa-solid" [class.fa-bars]="sidebarCollapsed" [class.fa-chevron-left]="!sidebarCollapsed"></i>
    </button>
  </div>

  <div class="menu-label" *ngIf="!sidebarCollapsed">Báo cáo của tôi</div>

  <ul class="menu custom-scrollbar">
    <li *ngFor="let item of menuItems" [class.active]="item.id === selectedReportId" (click)="selectMenu(item)"
      class="menu-item" [title]="item.fullName">
      <div class="icon-wrapper">
        <i class="fa-solid fa-file-lines"></i>
      </div>
      <span *ngIf="!sidebarCollapsed" class="item-text">{{ item.fullName }}</span>
      <div class="active-indicator" *ngIf="item.id === selectedReportId"></div>
    </li>
  </ul>

  <div class="sidebar-footer" *ngIf="!sidebarCollapsed">
    <div class="footer-actions relative">
      <!-- Notification Popover -->
      <div *ngIf="showNotifications"
        class="absolute bottom-full left-0 mb-4 w-72 max-h-96 overflow-y-auto glass-effect rounded-lg shadow-xl border border-slate-200 dark:border-white/10 z-[1000] flex flex-col origin-bottom-left animate-in zoom-in-95 duration-200">
        <div
          class="p-3 border-b border-slate-100 dark:border-white/10 flex justify-between items-center bg-white/50 dark:bg-slate-900/50 sticky top-0 backdrop-blur-md">
          <h4 class="text-xs font-bold uppercase text-slate-700 dark:text-slate-300">Thông báo</h4>
          <button (click)="loadNotifications()" class="text-accent hover:text-accent-hover text-[10px]">
            <i class="fa-solid fa-rotate"></i>
          </button>
        </div>

        <div *ngIf="notifications.length === 0" class="p-6 text-center opacity-50">
          <i class="fa-regular fa-bell-slash text-2xl mb-2"></i>
          <p class="text-[10px]">Không có thông báo nào</p>
        </div>

        <div *ngFor="let item of notifications" (click)="onNotificationClick(item)"
          class="p-3 border-b border-slate-100 dark:border-white/5 hover:bg-black/5 dark:hover:bg-white/5 cursor-pointer transition-colors relative"
          [class.bg-accent-50]="!item.isRead" [class.dark:bg-accent-900]="!item.isRead">
          <div *ngIf="!item.isRead" class="absolute top-3 right-3 w-2 h-2 bg-accent rounded-full"></div>
          <h5 class="text-xs font-bold text-slate-800 dark:text-slate-200 mb-1 pr-4">{{ item.title }}</h5>
          <p class="text-[11px] text-slate-600 dark:text-slate-400 line-clamp-2">{{ item.description }}</p>
          <span class="text-[9px] text-slate-400 mt-1 block">{{ item.dateCreate | date:'dd/MM HH:mm' }}</span>
        </div>
      </div>

      <button (click)="openFeedback()" class="footer-btn" title="Góp ý / Báo lỗi">
        <i class="fa-solid fa-envelope"></i>
      </button>
      <div class="divider"></div>

      <button (click)="toggleNotifications()" class="footer-btn relative" title="Thông báo">
        <i class="fa-solid fa-bell"></i>
        <span *ngIf="unreadCount > 0"
          class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full z-10 animate-pulse">
          {{ unreadCount > 9 ? '9+' : unreadCount }}
        </span>
      </button>
      <div class="divider"></div>
      <button (click)="toggleTheme()" class="footer-btn" [title]="'Đổi giao diện: ' + currentTheme">
        <i [class]="themeIcon"></i>
      </button>
      <div class="divider"></div>
      <button (click)="logout()" class="footer-btn logout" title="Đăng xuất">
        <i class="fa-solid fa-power-off"></i>
      </button>
    </div>
  </div>
</nav>

<app-feedback-dialog #feedbackDialog></app-feedback-dialog>
