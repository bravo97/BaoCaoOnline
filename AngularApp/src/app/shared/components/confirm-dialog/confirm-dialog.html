<div class="fixed inset-0 z-[2000] flex items-center justify-center p-4 animate-in fade-in duration-300"
  *ngIf="visible">
  <div class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm" (click)="onCancel()"></div>

  <div
    class="glass-effect rounded-3xl p-8 w-full max-w-sm relative z-10 shadow-2xl border border-glass/50 transform scale-in-center transition-all duration-300">
    <div class="w-16 h-16 rounded-2xl bg-red-500/10 flex items-center justify-center text-red-500 mx-auto mb-6">
      <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
    </div>

    <h3 class="text-xl font-black text-center text-primary mb-2">{{ title }}</h3>
    <p class="text-secondary text-sm text-center leading-relaxed mb-8">{{ message }}</p>

    <div class="flex gap-3">
      <button
        class="flex-1 py-3 px-6 rounded-xl bg-secondary/50 text-secondary font-bold text-sm hover:bg-secondary transition-all"
        (click)="onCancel()">Hủy</button>
      <button
        class="flex-1 py-3 px-6 rounded-xl bg-red-500 hover:bg-red-600 text-white font-bold text-sm shadow-lg shadow-red-500/20 transition-all hover:-translate-y-1 active:scale-95"
        (click)="onConfirm()">Xác nhận</button>
    </div>
  </div>
</div>
