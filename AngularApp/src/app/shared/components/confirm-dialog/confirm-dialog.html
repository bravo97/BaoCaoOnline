<div class="dialog-backdrop" *ngIf="visible">
  <div class="dialog-box">
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>

    <div class="actions">
      <button class="cancel" (click)="onCancel()">Hủy</button>
      <button class="confirm" (click)="onConfirm()">Xác nhận</button>
    </div>
  </div>
</div>
