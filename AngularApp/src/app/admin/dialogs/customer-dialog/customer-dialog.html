<div class="fixed inset-0 z-[2000] flex items-center justify-center p-4 animate-in fade-in duration-300 overflow-y-auto"
  *ngIf="visible">
  <div class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm" (click)="closeDialog()"></div>

  <div class="glass-effect rounded-3xl p-8 w-full max-w-2xl relative z-10 shadow-2xl border border-glass/50 my-auto">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h3 class="text-2xl font-black text-primary">{{ customer.id ? 'Cập nhật khách hàng' : 'Thêm khách hàng mới' }}
        </h3>
        <p class="text-secondary text-xs font-bold uppercase tracking-widest opacity-60">Thông tin kết nối cơ sở dữ liệu
        </p>
      </div>
      <button (click)="closeDialog()"
        class="w-10 h-10 rounded-xl bg-secondary/50 flex items-center justify-center text-secondary hover:bg-red-500 hover:text-white transition-all">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <form (ngSubmit)="saveCustomer()" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="group">
          <label
            class="block text-[10px] font-black text-secondary uppercase tracking-widest mb-2 ml-1 opacity-70 group-focus-within:text-accent transition-colors">Tên
            khách hàng</label>
          <input [(ngModel)]="customer.name" name="name" required placeholder="Tên hiển thị..."
            class="w-full bg-primary/50 border border-glass rounded-xl px-4 py-3 text-sm text-primary placeholder:text-secondary/30 focus:outline-none focus:ring-2 focus:ring-accent/50 transition-all" />
        </div>
        <div class="group">
          <label
            class="block text-[10px] font-black text-secondary uppercase tracking-widest mb-2 ml-1 opacity-70 group-focus-within:text-accent transition-colors">Email</label>
          <input [(ngModel)]="customer.email" name="email" type="email" required placeholder="nguoidung@vidu.com"
            class="w-full bg-primary/50 border border-glass rounded-xl px-4 py-3 text-sm text-primary placeholder:text-secondary/30 focus:outline-none focus:ring-2 focus:ring-accent/50 transition-all" />
        </div>
        <div class="group">
          <label
            class="block text-[10px] font-black text-secondary uppercase tracking-widest mb-2 ml-1 opacity-70 group-focus-within:text-accent transition-colors">IP
            Address</label>
          <input [(ngModel)]="customer.ipAddress" name="ipAddress" placeholder="e.g. 192.168.1.1"
            class="w-full bg-primary/50 border border-glass rounded-xl px-4 py-3 text-sm text-primary placeholder:text-secondary/30 focus:outline-none focus:ring-2 focus:ring-accent/50 transition-all font-mono" />
        </div>
        <div class="group">
          <label
            class="block text-[10px] font-black text-secondary uppercase tracking-widest mb-2 ml-1 opacity-70 group-focus-within:text-accent transition-colors">Port</label>
          <input [(ngModel)]="customer.port" name="port" type="number" placeholder="1433"
            class="w-full bg-primary/50 border border-glass rounded-xl px-4 py-3 text-sm text-primary focus:outline-none focus:ring-2 focus:ring-accent/50 transition-all" />
        </div>
        <div class="group">
          <label
            class="block text-[10px] font-black text-secondary uppercase tracking-widest mb-2 ml-1 opacity-70 group-focus-within:text-accent transition-colors">Server
            Name</label>
          <input [(ngModel)]="customer.serverName" name="serverName" placeholder="Tên server/instance..."
            class="w-full bg-primary/50 border border-glass rounded-xl px-4 py-3 text-sm text-primary placeholder:text-secondary/30 focus:outline-none focus:ring-2 focus:ring-accent/50 transition-all" />
        </div>
        <div class="group">
          <label
            class="block text-[10px] font-black text-secondary uppercase tracking-widest mb-2 ml-1 opacity-70 group-focus-within:text-accent transition-colors">Database
            Name</label>
          <input [(ngModel)]="customer.databaseName" name="databaseName" placeholder="Tên DB..."
            class="w-full bg-primary/50 border border-glass rounded-xl px-4 py-3 text-sm text-primary placeholder:text-secondary/30 focus:outline-none focus:ring-2 focus:ring-accent/50 transition-all" />
        </div>
        <div class="group">
          <label
            class="block text-[10px] font-black text-secondary uppercase tracking-widest mb-2 ml-1 opacity-70 group-focus-within:text-accent transition-colors">SQL
            Login</label>
          <input [(ngModel)]="customer.sqlLogin" name="sqlLogin" placeholder="SQL Login (e.g. sa)..."
            class="w-full bg-primary/50 border border-glass rounded-xl px-4 py-3 text-sm text-primary placeholder:text-secondary/30 focus:outline-none focus:ring-2 focus:ring-accent/50 transition-all" />
        </div>
        <div class="group">
          <label
            class="block text-[10px] font-black text-secondary uppercase tracking-widest mb-2 ml-1 opacity-70 group-focus-within:text-accent transition-colors">Database
            User</label>
          <input [(ngModel)]="customer.userName" name="userName" placeholder="Username đăng nhập DB..."
            class="w-full bg-primary/50 border border-glass rounded-xl px-4 py-3 text-sm text-primary placeholder:text-secondary/30 focus:outline-none focus:ring-2 focus:ring-accent/50 transition-all" />
        </div>
        <div class="group">
          <label
            class="block text-[10px] font-black text-secondary uppercase tracking-widest mb-2 ml-1 opacity-70 group-focus-within:text-accent transition-colors">Database
            Password</label>
          <input [(ngModel)]="customer.password" name="password" type="password" placeholder="••••••••"
            class="w-full bg-primary/50 border border-glass rounded-xl px-4 py-3 text-sm text-primary focus:outline-none focus:ring-2 focus:ring-accent/50 transition-all" />
        </div>
      </div>

      <div class="space-y-4">
        <h4 class="text-sm font-bold text-primary border-b border-glass/50 pb-2">Cấu hình Truy vấn (Queries)</h4>

        <div class="group">
          <label
            class="block text-[10px] font-black text-secondary uppercase tracking-widest mb-2 ml-1 opacity-70 group-focus-within:text-accent transition-colors">SQL
            Query (Report Data)</label>
          <textarea [(ngModel)]="customer.sqlReport" name="sqlReport" rows="3"
            placeholder="SELECT * FROM ... WHERE Parameter = @Parameter"
            class="w-full bg-primary/50 border border-glass rounded-xl px-4 py-3 text-sm text-primary font-mono placeholder:text-secondary/30 focus:outline-none focus:ring-2 focus:ring-accent/50 transition-all"></textarea>
        </div>

        <div class="group">
          <label
            class="block text-[10px] font-black text-secondary uppercase tracking-widest mb-2 ml-1 opacity-70 group-focus-within:text-accent transition-colors">SQL
            Query (Parameters)</label>
          <textarea [(ngModel)]="customer.sqlParameter" name="sqlParameter" rows="3"
            placeholder="SELECT Name, Param, Query... FROM DM_ThamSoBaoCao WHERE ReportName = @Name"
            class="w-full bg-primary/50 border border-glass rounded-xl px-4 py-3 text-sm text-primary font-mono placeholder:text-secondary/30 focus:outline-none focus:ring-2 focus:ring-accent/50 transition-all"></textarea>
        </div>

        <div class="group">
          <label
            class="block text-[10px] font-black text-secondary uppercase tracking-widest mb-2 ml-1 opacity-70 group-focus-within:text-accent transition-colors">SQL
            Query (Column Data)</label>
          <textarea [(ngModel)]="customer.sqlColumnQuery" name="sqlColumnQuery" rows="3"
            placeholder="SELECT ColumnName, DisplayName... FROM DM_CotBaoCao WHERE ReportName = @Name"
            class="w-full bg-primary/50 border border-glass rounded-xl px-4 py-3 text-sm text-primary font-mono placeholder:text-secondary/30 focus:outline-none focus:ring-2 focus:ring-accent/50 transition-all"></textarea>
        </div>
      </div>

      <div class="group pt-4 border-t border-glass/50">
        <label
          class="block text-[10px] font-black text-secondary uppercase tracking-widest mb-2 ml-1 opacity-70 group-focus-within:text-accent transition-colors">Ghi
          chú (Note)</label>
        <textarea [(ngModel)]="customer.note" name="note" rows="2" placeholder="Ghi chú thêm..."
          class="w-full bg-primary/50 border border-glass rounded-xl px-4 py-3 text-sm text-primary placeholder:text-secondary/30 focus:outline-none focus:ring-2 focus:ring-accent/50 transition-all"></textarea>
      </div>

      <div class="flex gap-4 pt-4">
        <button type="button" (click)="closeDialog()"
          class="flex-1 py-4 px-6 rounded-2xl bg-secondary/50 text-secondary font-bold text-sm hover:bg-secondary transition-all">Hủy
          bỏ</button>
        <button type="submit"
          class="flex-1 py-4 px-6 rounded-2xl bg-accent hover:bg-accent-hover text-white font-bold text-sm shadow-xl shadow-accent/20 transition-all hover:-translate-y-1 active:scale-95">Lưu
          thông tin</button>
      </div>
    </form>
  </div>
</div>
