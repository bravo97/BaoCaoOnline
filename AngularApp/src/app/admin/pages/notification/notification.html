<div class="space-y-6 animate-in fade-in duration-500">
  <div class="flex items-center justify-between">
    <h1 class="text-3xl font-black tracking-tight text-primary">Quản lý thông báo</h1>
    <button
      class="bg-accent hover:bg-accent-hover text-white font-bold py-3 px-6 rounded-2xl shadow-lg shadow-accent/20 transition-all duration-300 hover:-translate-y-1 active:scale-95 flex items-center gap-2"
      (click)="openModal()">
      <i class="fa-solid fa-plus"></i>
      Thêm thông báo
    </button>
  </div>

  <div class="glass-card overflow-hidden">
    <div class="overflow-x-auto custom-scrollbar">
      <table class="w-full text-left border-separate border-spacing-0">
        <thead>
          <tr class="bg-secondary/50">
            <th
              class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-secondary border-b border-glass rounded-tl-2xl">
              Tiêu đề
            </th>
            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-secondary border-b border-glass">
              Mô tả
            </th>
            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-secondary border-b border-glass">
              Ngày tạo
            </th>
            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-secondary border-b border-glass">
              Ngày cập nhật
            </th>
            <th
              class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-secondary border-b border-glass rounded-tr-2xl">
              Thao tác
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-glass/30">
          <tr *ngFor="let n of notifications" class="group transition-colors hover:bg-accent/5">
            <td class="px-6 py-4 text-sm font-semibold text-primary">{{ n.title }}</td>
            <td class="px-6 py-4 text-sm text-primary/80 truncate max-w-xs" title="{{n.description}}">{{ n.description
              }}</td>
            <td class="px-6 py-4 text-sm font-mono text-primary">{{ n.dateCreate | date:'dd/MM/yyyy' }}</td>
            <td class="px-6 py-4 text-sm font-mono text-primary">{{ n.dateUpdate | date:'dd/MM/yyyy' }}</td>
            <td class="px-6 py-4 text-sm whitespace-nowrap">
              <div class="flex gap-2">
                <button class="p-2 rounded-lg bg-accent/10 text-accent hover:bg-accent hover:text-white transition-all"
                  (click)="openModal(n)" title="Sửa">
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button
                  class="p-2 rounded-lg bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition-all"
                  (click)="deleteNotification(n.id)" title="Xóa">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
          <tr *ngIf="notifications.length === 0">
            <td colspan="5" class="px-6 py-8 text-center text-secondary italic">Chưa có thông báo nào.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div *ngIf="showModal"
  class="fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4 animate-in fade-in duration-200">
  <div class="glass-card w-full max-w-lg p-0 overflow-hidden shadow-2xl animate-in zoom-in-95 duration-200"
    (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-glass bg-secondary/30 flex justify-between items-center">
      <h3 class="text-xl font-bold text-primary">{{ isEditMode ? 'Cập nhật thông báo' : 'Thêm thông báo' }}</h3>
      <button (click)="closeModal()" class="text-secondary hover:text-white transition-colors">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="p-6 space-y-4">
      <div class="space-y-2">
        <label class="block text-sm font-medium text-secondary">Tiêu đề</label>
        <input type="text" [(ngModel)]="selectedNotification.title"
          class="w-full bg-secondary/50 border border-glass rounded-xl px-4 py-2 text-primary focus:outline-none focus:ring-2 focus:ring-accent/50 placeholder-secondary/50"
          placeholder="Nhập tiêu đề...">
      </div>

      <div class="space-y-2">
        <label class="block text-sm font-medium text-secondary">Nội dung</label>
        <textarea rows="4" [(ngModel)]="selectedNotification.description"
          class="w-full bg-secondary/50 border border-glass rounded-xl px-4 py-2 text-primary focus:outline-none focus:ring-2 focus:ring-accent/50 placeholder-secondary/50"
          placeholder="Nhập nội dung..."></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-glass bg-secondary/30 flex justify-end gap-3">
      <button (click)="closeModal()"
        class="px-4 py-2 rounded-xl text-secondary hover:bg-white/5 transition-colors font-medium">Hủy</button>
      <button (click)="saveNotification()" [disabled]="!selectedNotification.title"
        class="px-6 py-2 rounded-xl bg-accent text-white font-bold hover:bg-accent-hover shadow-lg shadow-accent/20 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
        {{ isEditMode ? 'Cập nhật' : 'Thêm mới' }}
      </button>
    </div>
  </div>
</div>
