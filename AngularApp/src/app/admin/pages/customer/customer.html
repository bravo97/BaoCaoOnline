<div class="space-y-6 animate-in fade-in duration-500">
  <div class="flex items-center justify-between">
    <h1 class="text-3xl font-black tracking-tight text-primary">Quản lý khách hàng</h1>
    <button
      class="bg-accent hover:bg-accent-hover text-white font-bold py-3 px-6 rounded-2xl shadow-lg shadow-accent/20 transition-all duration-300 hover:-translate-y-1 active:scale-95 flex items-center gap-2"
      (click)="openDialog()">
      <i class="fa-solid fa-plus"></i>
      Thêm khách hàng
    </button>
  </div>

  <div class="glass-card overflow-hidden">
    <div class="overflow-x-auto custom-scrollbar">
      <table class="w-full text-left border-separate border-spacing-0">
        <thead>
          <tr class="bg-secondary/50">
            <th
              class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-secondary border-b border-glass rounded-tl-2xl">
              Tên</th>
            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-secondary border-b border-glass">Email
            </th>
            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-secondary border-b border-glass">Địa
              chỉ IP</th>
            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-secondary border-b border-glass">Máy
              chủ</th>
            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-secondary border-b border-glass">
              Database</th>
            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-secondary border-b border-glass">Ghi
              chú</th>
            <th
              class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-secondary border-b border-glass rounded-tr-2xl">
              Thao tác</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-glass/30">
          <tr *ngFor="let c of customers" class="group transition-colors hover:bg-accent/5">
            <td class="px-6 py-4 text-sm font-semibold text-primary">{{ c.name }}</td>
            <td class="px-6 py-4 text-sm text-primary">{{ c.email }}</td>
            <td class="px-6 py-4 text-sm font-mono text-primary">{{ c.ipAddress }}:{{ c.port }}</td>
            <td class="px-6 py-4 text-sm text-primary">{{ c.serverName }}</td>
            <td class="px-6 py-4 text-sm text-primary">{{ c.databaseName }}</td>
            <td class="px-6 py-4 text-sm text-primary italic">{{ c.note }}</td>
            <td class="px-6 py-4 text-sm whitespace-nowrap">
              <div class="flex gap-2">
                <button class="p-2 rounded-lg bg-accent/10 text-accent hover:bg-accent hover:text-white transition-all"
                  (click)="openDialog(c)" title="Sửa">
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button
                  class="p-2 rounded-lg bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition-all"
                  (click)="confirm(c.id)" title="Xóa">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Customer Dialog -->
<app-customer-dialog #customerDialog (save)="saveCustomer($event)"></app-customer-dialog>
<app-confirm-dialog [visible]="confirmVisible" title="Xác nhận xóa"
  message="Bạn có chắc chắn muốn xóa khách hàng này không?" (confirm)="delete()"
  (cancel)="confirmVisible = false"></app-confirm-dialog>
