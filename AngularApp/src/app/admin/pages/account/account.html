<div class="accounts-page">
  <div class="page-header">
    <button class="btn-add" (click)="openDialog()">+ Thêm tài khoản</button>
  </div>

  <table class="accounts-table">
    <thead>
      <tr>
        <th>Customer ID</th>
        <th>Username</th>
        <th>Password</th>
        <th>Role</th>
        <th>Note</th>
        <th>Thao tác</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of accounts">
        <td>{{ a.customerId }}</td>
        <td>{{ a.username }}</td>
        <td>{{ a.password }}</td>
        <td>{{ a.role }}</td>
        <td>{{ a.note }}</td>
        <td>
          <button class="btn-edit" (click)="openDialog(a)">Sửa</button>
          <button class="btn-delete" (click)="openDialog(a.id)">Xóa</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Account Dialog -->
<app-account-dialog #accountDialog (save)="saveAccount($event)"></app-account-dialog>
